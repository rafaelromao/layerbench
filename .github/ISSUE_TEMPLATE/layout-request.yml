name: Suggest a layout for the Library
description: A layout to come with LayerBench, copied from where its author published it.
title: "Layout: "
body:
  - type: markdown
    attributes:
      value: |
        Each layout that comes with LayerBench is copied from where its author published it, and its card cites that source, so anyone can check it. Say what the layout is and where it comes from; it is added once it can be checked against that source.
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Magic Sturdy
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
      description: Who designed it.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where its author published it
      description: A firmware repository, a keymap file or a page. The layout's card will cite it.
      placeholder: https://github.com/…
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: The layout in LayerBench
      description: |
        Its link from Analyze, or its LayerBench JSON from the editor's JSON panel. Leave it empty if the source can be read as it is.
      render: text
  - type: input
    id: board
    attributes:
      label: Board
      description: The keyboard it was made for, if it is not a 34-key split.
  - type: input
    id: languages
    attributes:
      label: Languages
      placeholder: English, Brazilian Portuguese
  - type: textarea
    id: notes
    attributes:
      label: What the analysis should show
      description: Magic or repeat keys, combos, letters on a second layer, or anything else it is made around.
  - type: checkboxes
    id: published
    attributes:
      label: Source
      options:
        - label: I am its author, or its author published it where anyone can read it.
          required: true
