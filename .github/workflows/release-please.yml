name: release-please

# Release Please reads the Conventional Commits header of what is merged into main (a pull request's
# title: CONTRIBUTING.md) and keeps one pull request open that sets the next version in the
# package.json files and writes CHANGELOG.md. Merging that pull request tags the version
# (`vX.Y.Z`) and publishes a GitHub release. Nothing here builds or deploys: the merge is a push to
# main, which the `ci` workflow deploys as it does any other. A merge with nothing in it that is a
# feat, fix, perf or revert, or breaking (docs, ci, chore, ...), opens no release pull request.
# The config is release-please-config.json, the last released version .release-please-manifest.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The job token never writes: the GitHub App does, because a pull request opened with the job token
# starts no workflow, so the release pull request would never be checked. The App's token also
# needs no change to the repository's Actions settings (repository variable LAYERBENCH_APP_ID,
# secret LAYERBENCH_APP_PRIVATE_KEY, as in `library-edit` and `ci`).
permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'rafaelromao/layerbench'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app
        with:
          app-id: ${{ vars.LAYERBENCH_APP_ID }}
          private-key: ${{ secrets.LAYERBENCH_APP_PRIVATE_KEY }}
      # It runs on Node 24, which GitHub's runners provide.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The first release gets a hand-written introduction. Dispatch this workflow to retry the
      # edit if publishing succeeded but editing the notes did not; the composer is idempotent.
      - name: Add the first-release overview
        if: ${{ (steps.release.outputs.release_created == 'true' && steps.release.outputs.tag_name == 'v0.3.0') || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
        run: |
          if [ "$RELEASE_CREATED" = "true" ]; then
            release_notes="$RELEASE_BODY"
          else
            release_notes="$(gh release view v0.3.0 --json body --jq .body)"
          fi

          RELEASE_NOTES="$release_notes" node .github/scripts/compose-release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
          gh release edit v0.3.0 --notes-file "$RUNNER_TEMP/release-notes.md"
