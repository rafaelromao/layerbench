name: pages

# Publishes the landing page, docs/site, as this repository's GitHub Pages site:
# https://rafaelromao.github.io/layerbench/. It needs Settings → Pages → Source "GitHub Actions", and
# a repository variable APP_ORIGIN with the app's address, https://layerbench.github.io, which the
# page's links into the app are rewritten to.
on:
  push:
    branches: [main]
    paths: ['docs/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # A deployment that has started is left to finish; a newer run waits for it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails early, with a clear message, when Pages is not set up for this repository.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The page links to the app's views by path, which the dev server's preview at /about/ resolves;
      # published on its own, the links must name the app's origin.
      - run: |
          test -n "$APP_ORIGIN" || { echo "Set the APP_ORIGIN repository variable first."; exit 1; }
          # The value becomes part of a sed program below, so it must be an origin and nothing more.
          case "$APP_ORIGIN" in
            https://[A-Za-z0-9.-]*) ;;
            *) echo "APP_ORIGIN must be an https origin such as https://app.example.com"; exit 1 ;;
          esac
          cp -R docs/site _site
          sed -E -i "s#href=\"/(library|analyze|compare|rules|corpus|guide)#href=\"$APP_ORIGIN/\1#g" _site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
