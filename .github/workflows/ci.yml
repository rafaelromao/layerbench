name: ci

on:
  push:
    branches: [main]
  pull_request:

# Pushes to main deploy in the order they were made; a newer push to a pull request replaces the run
# still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job token never writes: the app is deployed to another repository, with a key of its own.
permissions:
  contents: read

jobs:
  # Formatting, lint, types and the build. The tests run beside it, one job a package: the web tests
  # take the longest, and nothing they do waits on the engine's.
  build:
    runs-on: ubuntu-latest
    # `actions` is to read the library-edit run a Library request waits for, below.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Dependency install scripts, tests and the build run after this; none of them needs a token.
          persist-credentials: false
      # A Library request still on a branch is one library-edit has not applied, or refused: what
      # would be merged is not what it asks for yet. library-edit applies it in a few minutes and
      # pushes the result, which starts this workflow again and replaces this run, so a request is
      # waited for here and not failed at once, as a proposal that opens red is taken for broken. It
      # fails when library-edit ended and nothing replaced this run: the request was refused, or
      # the application failed, and that run says why.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ -e .library ] || exit 0
          echo "A Library request is on this branch: waiting for the library-edit run that applies it."
          state=
          for _ in $(seq 1 80); do
            state=$(gh run list --workflow library-edit.yml --commit "$SHA" --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' || true)
            case "$state" in completed*) break ;; esac
            sleep 15
          done
          echo "library-edit: ${state:-no run found}"
          # Applied, its push replaces this run within seconds: what follows is for when it did not.
          sleep 90
          echo "::error::The Library request was not applied: see the library-edit workflow's run for this commit."
          exit 1
      # No version here: the action reads `packageManager` from package.json, and specifying both
      # makes it fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      # The sign-in Worker's address goes into the page's code and its content security policy. It
      # is set for this step only: the unit tests expect the page's own origin.
      - run: pnpm build
        env:
          VITE_AUTH_ORIGIN: ${{ vars.AUTH_ORIGIN }}
      - if: github.event_name == 'push'
        env:
          AUTH_ORIGIN: ${{ vars.AUTH_ORIGIN }}
        run: test -n "$AUTH_ORIGIN" || { echo "Set the AUTH_ORIGIN repository variable first."; exit 1; }
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  # A pull request runs the tests; a push to main runs them with coverage, about three times slower,
  # and fails when a package covers less than 80% of its lines, statements, functions or branches.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ['@layerbench/core', '@layerbench/web']
    name: test (${{ matrix.package }})
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "$PACKAGE" run "$SCRIPT"
        env:
          PACKAGE: ${{ matrix.package }}
          SCRIPT: ${{ github.event_name == 'push' && 'test:coverage' || 'test' }}

  # The app at https://layerbench.github.io is the GitHub Pages site of the repository
  # layerbench/layerbench.github.io. Pages publishes only the repository a workflow runs in, so the
  # build is pushed there, with a deploy key that can write to that repository and nothing else. The
  # key is a secret of the `app` environment, which only main may use.
  deploy:
    needs: [build, test]
    if: github.event_name == 'push' && github.repository == 'rafaelromao/layerbench'
    runs-on: ubuntu-latest
    environment:
      name: app
      url: https://layerbench.github.io/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app
          path: dist
      - uses: actions/checkout@v5
        with:
          repository: layerbench/layerbench.github.io
          ref: main
          ssh-key: ${{ secrets.APP_DEPLOY_KEY }}
          path: site
      # The bundles of the deploy before stay one more round, and older ones go: Pages lets a browser
      # keep a page for ten minutes, and a page asks for the bundles it was built with.
      - run: |
          cd site
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name assets ! -name .assets -exec rm -rf {} +
          if [ -d assets ]; then
            for f in assets/*; do
              [ -e "../dist/$f" ] || grep -qxF "$f" .assets 2>/dev/null || rm -f "$f"
            done
          fi
          cp -R ../dist/. .
          (cd ../dist && find assets -type f | sort) > .assets
          # Published as it is, with no Jekyll build on GitHub's side.
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "The site already has this build."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Deploy rafaelromao/layerbench@${GITHUB_SHA}"
          git push origin HEAD:main

  # A community layout promoted into the Library is moved: once the deploy that bundles it is out,
  # its file goes from the layerbench-data branch, so the Library lists it once. The GitHub App
  # pushes it (repository variable LAYERBENCH_APP_ID, secret LAYERBENCH_APP_PRIVATE_KEY), so the
  # branch's index workflow runs on the push; the job token still writes nothing.
  community-cleanup:
    needs: deploy
    if: github.event_name == 'push' && github.repository == 'rafaelromao/layerbench'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.LAYERBENCH_APP_ID }}
          private-key: ${{ secrets.LAYERBENCH_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: layerbench-data
          path: data
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm community-cleanup
        env:
          COMMUNITY_CLEANUP: ${{ github.workspace }}/data
      - env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          cd data
          git add -A community
          if git diff --cached --quiet; then
            echo "No community layout was moved into the Library."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Community: the layouts rafaelromao/layerbench@${GITHUB_SHA} bundles leave"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:layerbench-data
